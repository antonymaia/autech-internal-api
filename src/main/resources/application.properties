# Diretorio para o log de cobranca via WhatsApp (relativo ao diretorio de execucao da aplicacao)
log.cobranca.dir=log

# Mercado Pago — credenciais ficam em application-prod.properties (NAO commitar em prod)
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.webhook-url=${MP_WEBHOOK_URL:https://api.autech.net.br/internal-admin-api/pub/webhook/mercadopago}
# Email de test user do MP para teste em sandbox com credencial de producao.
# Preencher APENAS em ambiente de teste. Em producao, deixar vazio.
