# Portal do cliente (CORS)
portal.cors.origin=${PORTAL_CORS_ORIGIN:http://localhost:4200}

# Rate limit do /pub/cliente (requisicoes por minuto por IP)
portal.rate-limit.per-minute=10

# Link do portal enviado nas mensagens de cobranca do WhatsApp
portal.url=${PORTAL_URL:https://pagar.autech.net.br}

# Token do login dos colaboradores: segredo em base64 com 32 bytes ou mais (openssl rand -base64 48).
# Vazio: gera um segredo aleatorio a cada inicio (os tokens deixam de valer quando a API reinicia).
jwt.secret=${JWT_SECRET:}
jwt.validade-horas=12

# Pasta servida pelo nginx de downloads.autech.net.br, onde os colaboradores publicam arquivos.
# Vazio: o envio de arquivos fica desligado (responde 500 com aviso).
downloads.raiz=${DOWNLOADS_RAIZ:}