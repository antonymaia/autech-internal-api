whatsapp.evolution.instance.name=evolution
whatsapp.evolution.api-key=autech
# Numeros que recebem o aviso de PIX confirmado, separados por virgula, com 55 + DDD + 9 + 8 digitos
# (ex.: 5581999999999,5581988888888). Vazio: o aviso interno nao e enviado e o pagamento fica
# registrado no log de cobranca. A confirmacao ao cliente vai para o telefone do cadastro dele.
whatsapp.aviso-pagamento.telefones=${WHATSAPP_AVISO_PAGAMENTO_TELEFONES:}

pix.chave=11765624000116
